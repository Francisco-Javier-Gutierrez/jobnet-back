name: Deploy Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Typecheck & Compile TypeScript
        run: npm run build

      - name: Bundle & Package 5 Express/Event Lambdas
        run: |
          mkdir -p dist/zips
          for item in \
            "src/lambda.ts:api" \
            "src/lambdaWs.ts:ws" \
            "src/handlers/wsAuthorizer.ts:wsAuthorizer" \
            "src/handlers/postConfirmation.ts:postConfirmation" \
            "src/lambdaSuspensionExpiry.ts:suspensionExpiry"; do
            entry="${item%%:*}"
            name="${item##*:}"
            mkdir -p "dist/lambdas/$name"
            npx esbuild "$entry" \
              --bundle \
              --platform=node \
              --target=node20 \
              --format=cjs \
              --outfile="dist/lambdas/$name/index.js" \
              --external:@aws-sdk/*
            (cd "dist/lambdas/$name" && zip -r "../../zips/$name.zip" .)
          done
          ls -lh dist/zips

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform Init (Remote S3 State)
        run: |
          cd terraform/environments/prod
          terraform init -input=false

      - name: Terraform Apply (Infra + Compute 5 Lambdas + APIs)
        env:
          TF_VAR_deepseek_api_key: ${{ secrets.DEEPSEEK_API_KEY }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_deepseek_api_url: ${{ vars.DEEPSEEK_API_URL || 'https://api.deepseek.com/chat/completions' }}
          TF_VAR_gemini_api_url: ${{ vars.GEMINI_API_URL || 'https://generativelanguage.googleapis.com/v1beta/models' }}
          TF_VAR_ai_provider: ${{ vars.AI_PROVIDER || 'deepseek' }}
          TF_VAR_ai_moderation_provider: ${{ vars.AI_MODERATION_PROVIDER || 'deepseek' }}
          TF_VAR_ai_moderation_model: ${{ vars.AI_MODERATION_MODEL || 'deepseek-chat' }}
          TF_VAR_ai_reasoning_provider: ${{ vars.AI_REASONING_PROVIDER || 'deepseek' }}
          TF_VAR_ai_reasoning_model: ${{ vars.AI_REASONING_MODEL || 'deepseek-chat' }}
        run: |
          cd terraform/environments/prod
          terraform apply -auto-approve -input=false
          echo "HTTP_API_URL=$(terraform output -raw http_api_url)" >> $GITHUB_ENV
          echo "WS_API_URL=$(terraform output -raw ws_api_url)" >> $GITHUB_ENV

      - name: Verify API Health Endpoint
        run: |
          echo "Checking ${HTTP_API_URL}/health ..."
          curl --fail --show-error --retry 5 --retry-delay 5 "${HTTP_API_URL}/health"
          echo ""
          echo "WebSocket API: ${WS_API_URL}"
