service: jobnet-back

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: us-east-1
  environment:
    DYNAMODB_TABLE: jobnet-jobs-${self:provider.stage}
    S3_UPLOAD_BUCKET: jobnet-uploads-${self:provider.stage}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, 'us-east-1_local'}
    OPENSEARCH_ENDPOINT: ${env:OPENSEARCH_ENDPOINT, 'localhost:9200'}

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    exclude: []
    target: node18
    platform: node

functions:
  getJobs:
    handler: src/handlers/jobs.getJobs
  createJob:
    handler: src/handlers/jobs.createJob
  getUploadPresignedUrl:
    handler: src/handlers/jobs.getUploadPresignedUrl
  sendNotificationEmail:
    handler: src/handlers/jobs.sendNotificationEmail
  wsAuthorizer:
    handler: src/handlers/wsAuthorizer.handler
  wsConnect:
    handler: src/handlers/wsHandlers.connect
  wsDisconnect:
    handler: src/handlers/wsHandlers.disconnect
  wsDefault:
    handler: src/handlers/wsHandlers.defaultRoute
