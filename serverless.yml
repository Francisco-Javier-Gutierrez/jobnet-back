service: jobnet-back

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'prod'}
  region: us-east-1
  httpApi:
    cors:
      allowedOrigins:
        - "https://dsty3j5u0b31g.cloudfront.net"
        - "http://localhost:3000"
      allowedHeaders:
        - Content-Type
        - Authorization
        - X-Amz-Date
        - X-Api-Key
        - X-Amz-Security-Token
        - X-Amz-User-Agent
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowCredentials: true
      maxAge: 3600
  environment:
    DYNAMODB_TABLE: jobnet-jobs-${self:provider.stage}
    S3_UPLOAD_BUCKET: jobnet-uploads-${self:provider.stage}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, 'us-east-1_trquL61F2'}
    COGNITO_CLIENT_ID: ${env:COGNITO_CLIENT_ID, '4ef8k4tofjj4ounvo8nf7d9pep'}
    VAPID_PUBLIC_KEY: ${env:VAPID_PUBLIC_KEY, 'BOIrktuQCHHiOWcKICA7YEwdKJf8WNYCmBS_PI338wnaB9VqXPQfCRwTN5NLYokujXBp5pdD83av6DACG2rAYok'}
    VAPID_PRIVATE_KEY: ${env:VAPID_PRIVATE_KEY, 'oJXO_P5wuj45JaC8taPC1E3pPR8Hu1zi_kAiv5yAaNg'}
    VAPID_SUBJECT: ${env:VAPID_SUBJECT, 'mailto:contacto@franciscojgh.com'}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:BatchGetItem
          Resource:
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE}"
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE}/index/*"
        - Effect: Allow
          Action:
            - dynamodb:GetRecords
            - dynamodb:GetShardIterator
            - dynamodb:DescribeStream
            - dynamodb:ListStreams
          Resource:
            - "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE}/stream/*"
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:PutObjectAcl
          Resource: "arn:aws:s3:::${self:provider.environment.S3_UPLOAD_BUCKET}/*"

package:
  individually: false

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: true
    sourcemap: false
    exclude:
      - "@aws-sdk/client-apigatewaymanagementapi"
      - "@aws-sdk/client-dynamodb"
      - "@aws-sdk/client-s3"
      - "@aws-sdk/client-ses"
      - "@aws-sdk/lib-dynamodb"
      - "@aws-sdk/s3-request-presigner"
    target: node20
    platform: node
    concurrency: 1

  serverless-offline:
    httpPort: 3001
    websocketPort: 3002
    lambdaPort: 3003

functions:
  cognitoPostConfirmation:
    handler: src/handlers/postConfirmation.handler
    events:
      - cognitoUserPool:
          pool: jobnet-user-pool-${self:provider.stage}
          trigger: PostConfirmation
          existing: true
  getJobs:
    handler: src/handlers/jobs.getJobs
    events:
      - httpApi:
          path: /jobs
          method: get
  getJobById:
    handler: src/handlers/jobs.getJobById
    events:
      - httpApi:
          path: /jobs/{id}
          method: get
  createJob:
