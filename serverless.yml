service: jobnet-back

provider:
  name: aws
  runtime: nodejs18.x
  stage: ${opt:stage, 'dev'}
  region: us-east-1
  httpApi:
    cors: true
  environment:
    DYNAMODB_TABLE: jobnet-jobs-${self:provider.stage}
    S3_UPLOAD_BUCKET: jobnet-uploads-${self:provider.stage}
    COGNITO_USER_POOL_ID: ${env:COGNITO_USER_POOL_ID, 'us-east-1_local'}
    OPENSEARCH_ENDPOINT: ${env:OPENSEARCH_ENDPOINT, 'localhost:9200'}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:Scan
          Resource: "arn:aws:dynamodb:${self:provider.region}:*:table/${self:provider.environment.DYNAMODB_TABLE}"
        - Effect: Allow
          Action:
            - cognito-idp:AdminAddUserToGroup
          Resource: "arn:aws:cognito-idp:${self:provider.region}:*:userpool/*"
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:PutObjectAcl
          Resource: "arn:aws:s3:::${self:provider.environment.S3_UPLOAD_BUCKET}/*"

plugins:
  - serverless-esbuild
  - serverless-offline

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    exclude: []
    target: node18
    platform: node

  serverless-offline:
    httpPort: 3001
    websocketPort: 3002
    lambdaPort: 3003

functions:
  cognitoPostConfirmation:
    handler: src/handlers/postConfirmation.handler
    events:
      - cognitoUserPool:
          pool: jobnet-user-pool-${self:provider.stage}
          trigger: PostConfirmation
          existing: true
  getJobs:
    handler: src/handlers/jobs.getJobs
    events:
      - httpApi:
          path: /jobs
          method: get
  createJob:
    handler: src/handlers/jobs.createJob
    events:
      - httpApi:
          path: /jobs
          method: post
  getUploadPresignedUrl:
    handler: src/handlers/jobs.getUploadPresignedUrl
    events:
      - httpApi:
          path: /upload-url
          method: get
  sendNotificationEmail:
    handler: src/handlers/jobs.sendNotificationEmail
    events:
      - httpApi:
          path: /notify
          method: post
  wsAuthorizer:
    handler: src/handlers/wsAuthorizer.handler
  wsConnect:
    handler: src/handlers/wsHandlers.connect
    events:
      - websocket:
          route: $connect
          authorizer:
            name: wsAuthorizer
            identitySource:
              - "route.request.querystring.token"
  wsDisconnect:
    handler: src/handlers/wsHandlers.disconnect
    events:
      - websocket:
          route: $disconnect
  wsDefault:
    handler: src/handlers/wsHandlers.defaultRoute
    events:
      - websocket:
          route: $default
  getProfile:
    handler: src/handlers/profile.getProfile
    events:
      - httpApi:
          path: /profile/{id}
          method: get
  updateProfile:
    handler: src/handlers/profile.updateProfile
    events:
      - httpApi:
          path: /profile/{id}
          method: post
  listProfiles:
    handler: src/handlers/profile.listProfiles
    events:
      - httpApi:
          path: /profiles
          method: get
  getCatalog:
    handler: src/handlers/catalog.getCatalog
    events:
      - httpApi:
          path: /catalog
          method: get
  createCatalogItem:
    handler: src/handlers/catalog.createCatalogItem
    events:
      - httpApi:
          path: /catalog
          method: post
  updateCatalogItem:
    handler: src/handlers/catalog.updateCatalogItem
    events:
      - httpApi:
          path: /catalog/{id}
          method: put
  deleteCatalogItem:
    handler: src/handlers/catalog.deleteCatalogItem
    events:
      - httpApi:
          path: /catalog/{id}
          method: delete
  updateJob:
    handler: src/handlers/jobs.updateJob
    events:
      - httpApi:
          path: /jobs/{id}
          method: put
  deleteJob:
    handler: src/handlers/jobs.deleteJob
    events:
      - httpApi:
          path: /jobs/{id}
          method: delete
  applyToJob:
    handler: src/handlers/applications.applyToJob
    events:
      - httpApi:
          path: /jobs/{id}/apply
          method: post
  getJobApplicants:
    handler: src/handlers/applications.getJobApplicants
    events:
      - httpApi:
          path: /jobs/{id}/applicants
          method: get
  getMyApplications:
    handler: src/handlers/applications.getMyApplications
    events:
      - httpApi:
          path: /applications
          method: get
  updateApplicationStatus:
    handler: src/handlers/applications.updateApplicationStatus
    events:
      - httpApi:
          path: /applications/{jobId}/{candidateId}/status
          method: put
  getPosts:
    handler: src/handlers/posts.getPosts
    events:
      - httpApi:
          path: /posts
          method: get
  createPost:
    handler: src/handlers/posts.createPost
    events:
      - httpApi:
          path: /posts
          method: post
  toggleLikePost:
    handler: src/handlers/posts.toggleLikePost
    events:
      - httpApi:
          path: /posts/{id}/like
          method: post
  addCommentPost:
    handler: src/handlers/posts.addCommentPost
    events:
      - httpApi:
          path: /posts/{id}/comment
          method: post
  deleteCommentPost:
    handler: src/handlers/posts.deleteCommentPost
    events:
      - httpApi:
          path: /posts/{id}/comment/{commentId}
          method: delete
  toggleBookmarkPost:
    handler: src/handlers/posts.toggleBookmarkPost
    events:
      - httpApi:
          path: /posts/{id}/bookmark
          method: post



